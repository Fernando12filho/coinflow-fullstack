# Build the CoinFlow desktop app for macOS, Windows and Linux.
#
# - Runs on version tags (v1.2.3) and by hand (Actions tab > Desktop app > Run workflow).
# - Every build is smoke-tested: the packaged app starts, serves its pages and exits.
# - A tag publishes a GitHub Release with the builds and their SHA-256 checksums.
# - macOS builds are signed and notarized when the Apple secrets exist (see RELEASING.md);
#   otherwise they are unsigned.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m "not e2e"

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macOS-arm64 }
          - { os: macos-15-intel, name: macOS-x64 }
          - { os: windows-latest, name: Windows-x64 }
          - { os: ubuntu-24.04, name: Linux-x64 }
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches app/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from app.version import __version__; print(__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/version.py ($version)"; exit 1
          fi

      - name: Install the native window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config gir1.2-webkit2-4.1
          pip install PyGObject==3.56.3

      - run: pip install -r requirements-desktop.txt

      - name: Import the Developer ID certificate (macOS, when secrets are set)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: pyinstaller --noconfirm coinflow.spec

      - name: Sign (macOS, when secrets are set)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" dist/CoinFlow.app
          codesign --verify --deep --strict --verbose=2 dist/CoinFlow.app

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/CoinFlow.app/Contents/MacOS/CoinFlow --smoke-test --data-dir "$RUNNER_TEMP/smoke"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed .exe returns immediately in a shell, so wait for it and read its exit code
          $p = Start-Process -FilePath dist\CoinFlow\CoinFlow.exe -ArgumentList '--smoke-test','--data-dir',"$env:RUNNER_TEMP\smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: dist/CoinFlow/CoinFlow --smoke-test --data-dir "$RUNNER_TEMP/smoke"

      - name: Notarize (macOS, when secrets are set)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent dist/CoinFlow.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple dist/CoinFlow.app
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Package with checksums
        shell: bash
        run: |
          version=$(python -c "from app.version import __version__; print(__version__)")
          name="CoinFlow-$version-${{ matrix.name }}"
          mkdir -p release
          case "$RUNNER_OS" in
            macOS)   hdiutil create -volname CoinFlow -srcfolder dist/CoinFlow.app -ov -format UDZO "release/$name.dmg" ;;
            Windows) 7z a "release/$name.zip" ./dist/CoinFlow/* ;;
            Linux)   tar -czf "release/$name.tar.gz" -C dist CoinFlow ;;
          esac
          cd release
          for file in *; do shasum -a 256 "$file" > "$file.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: CoinFlow-${{ matrix.name }}
          path: release/*

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "CoinFlow $GITHUB_REF_NAME" --generate-notes
