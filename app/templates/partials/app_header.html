{% set on_portfolio = request.endpoint in ('dashboard.index', 'dashboard.dashboard') %}
{% set on_newsletter = request.endpoint == 'dashboard.newsletter' %}
<header class="app-header">
    <a href="{{ url_for('dashboard.index') }}" class="logo">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="">
        <span>COINFLOW</span>
    </a>
    <nav class="nav" aria-label="Main">
        <a href="{{ url_for('dashboard.index') }}" class="pill{{ ' active' if on_portfolio }}"{% if on_portfolio %} aria-current="page"{% endif %}>Portfolio</a>
        <a href="{{ url_for('dashboard.newsletter') }}" class="pill{{ ' active' if on_newsletter }}"{% if on_newsletter %} aria-current="page"{% endif %}>Newsletter</a>
        <span class="pill disabled-link" title="Coming soon" aria-disabled="true">Invoice MK</span>
        <span class="pill disabled-link" title="Coming soon" aria-disabled="true">Forum</span>
    </nav>
    <div class="username-logout">
        <span class="username">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.75 14v-.75A3.25 3.25 0 0 1 6 10h4a3.25 3.25 0 0 1 3.25 3.25V14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            {{ g.user['username'] }}
        </span>
        <a href="{{ url_for('auth.logout') }}" class="pill logout-button">Log Out</a>
    </div>
</header>
<div class="stripe-band" aria-hidden="true"></div>
