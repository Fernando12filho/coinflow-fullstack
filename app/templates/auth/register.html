{% extends 'auth/_layout.html' %}

{% block title %}Register - Coinflow{% endblock %}

{% block toggle %}
<a href="{{ url_for('auth.login') }}" class="auth-toggle">Log In</a>
{% endblock %}

{% block form %}
<form method="post" class="auth-form" data-loading="Creating your account...">
    <h1>Sign Up</h1>
    <input name="email" type="email" placeholder="Email" autocomplete="email" value="{{ request.form.get('email', '') }}" required autofocus>
    <input name="username" placeholder="Username" autocomplete="username" value="{{ request.form.get('username', '') }}" required>
    <input name="password" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password" minlength="6" required>
    <button type="submit">Sign Up</button>
</form>
{% endblock %}
