{% extends 'auth/_layout.html' %}

{% block title %}Log In - Coinflow{% endblock %}

{% block form %}
<form method="post" class="auth-form" data-loading="Logging in...">
    <div class="auth-title-row">
        <h1>Log In</h1>
        <a href="{{ url_for('auth.register') }}" class="auth-toggle">Register</a>
    </div>
    <label>
        Username
        <input name="username" autocomplete="username" value="{{ request.form.get('username', '') }}" required autofocus>
    </label>
    <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log In</button>
    <p class="auth-helper">New here? <a href="{{ url_for('auth.register') }}">Register</a></p>
</form>
{% endblock %}
